# Production on one Linux VPS. Lives at /srv/orderdesk/compose.prod.yaml next to a
# .env (see .env.example in this folder). Images come from GHCR, tagged by commit.
#
#   IMAGE_TAG=<sha> docker compose -f compose.prod.yaml up -d
#
# deploy.sh wraps this with a health gate and automatic rollback.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: orderdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderdesk -d orderdesk"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://orderdesk:${POSTGRES_PASSWORD}@db:5432/orderdesk
      APP_ENV: production
    ports:
      - "127.0.0.1:8000:8000"   # only the reverse proxy and the health gate talk to it
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python -m orderdesk.worker
    environment:
      DATABASE_URL: postgresql+psycopg://orderdesk:${POSTGRES_PASSWORD}@db:5432/orderdesk
      APP_ENV: production
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}   # e.g. orders.example.com for automatic HTTPS
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
